# Minimal end-to-end smoke test for a single 8 GB CUDA GPU.
# This configuration validates the training pipeline; it is not a paper experiment.
seed: 42

loss_type:
  name: PureL1

meter:
  name: WavMeter

data:
  name: SyntheticPUMat128Test
  image_size: 128
  color_channels: 1
  num_workers: 0
  k_min: 0
  k_max: 7
  wavelet_level: 1
  wavelet_type: haar
  mean: 10.0180
  std: 5.7466
  scale_alpha: 1
  noise_snr: 30

training:
  device: cuda
  brand_new_epochs: 1
  continue_training_epochs: 1
  batch_size: 1
  use_all_data: false
  amp: false
  log_freq: 1
  snapshot_freq: 1
  snapshot_sampling: false
  snapshot_sampling_freq: 1
  snapshot_val: false
  snapshot_val_freq: 1
  snapshot_batch_size: 1
  snapshot_best_loss: false
  best_evaluate_loss: 1.0

model:
  name: FDUNet
  sample_size: 128
  in_channels: 1
  out_channels: 1
  layers_per_block: 1
  block_out_channels: [32, 32, 64, 64]
  cross_attention_dim: 192

diffusion:
  name: FduDDPMDiffusion
  timesteps: 1000
  num_train_timesteps: 1000
  num_infer_timesteps: 2
  conditioning_channels: 2
  repeat_channels: 1
  use_patch_embedding: false
  use_controlnet: false
  prediction_type: sample

sampling:
  device: cuda
  batch_size: 1
  total_samples: 1
  record_freq: 1
  eps: 1.0e-5
  fix_seed: true

val:
  device: cuda
  batch_size: 1

test:
  device: cuda
  batch_size: 1

optim:
  optimizer: Adam
  lr: 0.0001
  weight_decay: 0.0001
  beta1: 0.9
  eps: 1.0e-8
  warmup: 2
  grad_clip: 1.0
  momentum: 0.9

iio:
  use_tensorboard: true
  use_wandb: false
  save_pth_to_wandb: false
